apiVersion: apps/v1
kind: Deployment

metadata:
  name: eks-cicd-app
  namespace: prod

spec:
  replicas: 2

  selector:
    matchLabels:
      app: eks-cicd-app

  template:
    metadata:
      labels:
        app: eks-cicd-app

    spec:
      containers:
        - name: eks-cicd-app

          image: 802892343835.dkr.ecr.ap-south-1.amazonaws.com/eks-cicd-app:v1

          ports:
            - containerPort: 5000

          env:
            - name: DB_HOST
              value: cicd-postgres.cdmyy260esy6.ap-south-1.rds.amazonaws.com
            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"